[package]
name = "rust-confessional"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A stage-friendly durable AI agent demo using Rust and Temporal"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["form", "json"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
futures-util = "0.3"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
temporalio-client = "=0.5.0"
temporalio-common = "=0.5.0"
temporalio-macros = "=0.5.0"
temporalio-sdk = "=0.5.0"
temporalio-sdk-core = "=0.5.0"
temporalio-workflow = "=0.5.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = { version = "1.2", features = ["serde"] }
url = "2.5"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = "thin"
